name: Test

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test
